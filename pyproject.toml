[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-to-eval"
version = "0.1.0"
description = "Turn AI traces and production failures into versioned regression tests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Trace-to-Eval contributors" }]
keywords = ["ai", "evaluation", "regression-testing", "traces", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<3",
  "pip-audit>=2.8,<3",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
trace-to-eval = "trace_to_eval.cli:main"

[project.urls]
Documentation = "https://github.com/trace-to-eval/trace-to-eval#readme"
Source = "https://github.com/trace-to-eval/trace-to-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_to_eval = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
files = ["src"]
